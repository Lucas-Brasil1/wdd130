<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting</title>
    <meta name="description" content="contact us for a better experience ">
    <meta name="author" content="Lucas Pena Brasil">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="The Whitewater Raftings icon" width="100">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1> 
        <address>
            123 Main River Street<br>
            Kolob, California<br>
            +1 999 999 9999<br>
            info@whitewater.com
        </address>
        <div class="contact-main">
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15936.510984849652!2d-60.06063965!3d-3.0604884500000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1791641744549!5m2!1spt-BR!2sbr" width="600" height="450"  allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <form action="">
            <label for="fullname">Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
            <p>Massage Purpuse</p>
            <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
            <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
            <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
            <label for="message">Message</label>
           <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
           <label><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly newsletter</label>
           <button type="submit">Get in Touch!</button>
        </form>
        </div>
        

        <section class="staff">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/maria-silva.jpg" alt="Maria Silva, Lead Guide">
                <figcaption>Maria Silva - Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/john-carter.jpg" alt="John Carter, Safety Instructor">
                <figcaption>John Carter - Safety Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/ana-souza.jpg" alt="Ana Souza, Reservations Maneger">
                <figcaption>Ana Souza - Reservations Manager</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting - Lucas Pena Brasil</p>
        <nav class="socialmedia">
            <figure>
                <a href="https://facebook.com"><img src="images/facebook.svg" alt="facebook icon"
                      width="50"></a>
                <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="linkdin icon"
                      width="50"></a>
                <a href="https://instagram.com"><img src="images/instagram.svg" alt="instagram icon"
                      width="50"></a>
            </figure>
        </nav>
    </footer>
</body>

</html>
